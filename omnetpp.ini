[General]
network = EpidemicBroadcastTree
sim-time-limit = 10s

# Network
**.numNodes = 50
**.sourceNode = 0

# Epidemic protocol
**.fanout = 4
**.forwardDelay = 10ms
**.gossipDelay = 1ms

# Recording
output-vector-file = results/epidemic.vec
output-scalar-file = results/epidemic.sca

**.vector-recording = true

# Reproducibility
seed-set = 1

[Config Small]
description = "20-node epidemic broadcast"
**.numNodes = 20
**.fanout = 3
sim-time-limit = 5s

[Config Medium]
description = "50-node epidemic broadcast"
**.numNodes = 50
**.fanout = 4
sim-time-limit = 10s

[Config Large]
description = "100-node epidemic broadcast"
**.numNodes = 100
**.fanout = 6
sim-time-limit = 15s
