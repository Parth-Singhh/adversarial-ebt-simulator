[General]
network = EpidemicBroadcastTree
sim-time-limit = 20s

# Core scale
**.numNodes = 60
**.sourceNode = 0

# Protocol
**.fanout = 4
**.forwardDelay = 10ms
**.gossipDelay = 1ms
**.maxMessages = 1000

# Session + repeated broadcasts
**.sessionId = ${session=1}
**.numBroadcasts = ${broadcasts=3}
**.firstBroadcastAt = 0s
**.broadcastInterval = 250ms

# Topology
**.topologyMode = "${topo=complete,erdosRenyi,fixedDegree}"
**.erProbability = ${erp=0.08,0.15}
**.fixedDegree = ${k=4,8}
**.graphFile = ""
**.linkDelay = 1ms

# Adversary sweeps
**.maliciousFraction = ${mf=0,0.1,0.2,0.3}
**.attackType = "${attack=honest,drop,selective_forward,delay_jitter,flood_duplicates,equivocation,spoof_metadata}"
**.maliciousSeed = ${mseed=3}
**.fixedMaliciousNodes = ""
**.maliciousJitterMax = 50ms

# Repetitions
repeat = ${rep=0..4}
seed-set = ${seed=1..5}

# Recording
output-vector-file = results/${configname}-topo_${topo}-mf_${mf}-atk_${attack}-rep_${rep}.vec
output-scalar-file = results/${configname}-topo_${topo}-mf_${mf}-atk_${attack}-rep_${rep}.sca
**.vector-recording = true

[Config Baseline]
description = "Baseline honest dissemination over complete graph"
**.topologyMode = "complete"
**.maliciousFraction = 0
**.attackType = "honest"

[Config Adversarial]
description = "Adversarial sweep over fractions and attack models"
**.topologyMode = "complete"

[Config TopologyStudy]
description = "Overlay sensitivity under adversarial pressure"
**.maliciousFraction = ${mf=0.1,0.2}
**.attackType = "${attack=drop,selective_forward,flood_duplicates}"
**.topologyMode = "${topo=complete,erdosRenyi,fixedDegree}"
